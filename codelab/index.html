<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Code Lab</title>
    <link href="./css/toaster.css" rel="stylesheet" />
    <link href="./css/icon.css" rel="stylesheet" />
    <link href="./css/modal.css" rel="stylesheet" />
    <link href="./css/menu.css" rel="stylesheet" />
    <link href="./css/tooltip.css" rel="stylesheet" />
    <link href="./css/style.css" rel="stylesheet" />
    <script src="./node_modules/socket.io/client-dist/socket.io.min.js"></script>
    <script src="./node_modules/blockly/blockly_compressed.js"></script>
    <script src="./node_modules/blockly/blocks_compressed.js"></script>
    <script src="./node_modules/blockly/javascript_compressed.js"></script>
    <script src="./node_modules/@blockly/field-colour/dist/index.js"></script>
    <script src="./node_modules/blockly/msg/fr.js"></script>
    <script src="./node_modules/blockly-field-color-wheel/dist/index.js"></script>
  </head>
  <body>
    <div class="page-container">
      <div class="toolbar menu" aria-role="banner">
        <div class="btnGroup">
          <button id="account-btn" class="btn">
            <span class="material-icons" id="account-btn-icon"
              >rocket_launch</span
            >
          </button>
          <div class="logo">SpaceCode</div>
          <!--
          <button id="refresh-btn" class="btn" onclick="resetWorkspace()">
            <span class="material-icons" id="refresh-btn-icon">refresh</span>
          </button>
          -->
        </div>
        <div class="btnGroup">
          <a id="help-btn" class="btn" target="_blank" href="/docs/">
            <span class="material-icons">question_mark</span>
          </a>
          <button id="run-btn" class="btn">
            <span class="material-icons" id="run-btn-icon">play_arrow</span>
          </button>
        </div>
      </div>
      <div id="blocklyArea"></div>
    </div>

    <div id="blocklyDiv" style="position: absolute"></div>

    <div id="loginModal" class="modal">
      <div class="modal-content animate container">
        <form onsubmit="event.preventDefault(); validateAccount();">
          <div class="imgcontainer">
            <span onclick="hideLoginModal()" class="close" title="Close Modal"
              >&times;</span
            >
            <div id="rocket-container">
              <span class="material-icons" id="rocket"> rocket_launch </span>
            </div>
          </div>

          <div>
            <label class="required"><b>Pseudo</b></label>
            <input
              type="text"
              placeholder="Votre pseudo"
              name="username"
              id="username"
              required
            />

            <label class="required"><b>Téléphone</b></label
            ><br />
            <small>Pour pouvoir vous contacter en cas de victoire !</small>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="Votre 06 ou 07"
              pattern="[0-9]{10}"
              required
            />
            <small
              >Promis, vos données seront effacées à la fin du challenge ! 👼 </small
            ><br />
            <br />
            <label><b>Couleur de vaisseau</b></label
            ><br />
            <input type="color" id="color" name="color" value="#f6b73c" />

            <button type="submit" id="validate-account-btn">Valider</button>
          </div>
        </form>
        <button id="reset-btn" onclick="resetWorkspace()">Réinitialiser</button>
      </div>
    </div>

    <!-- The actual snackbar -->
    <div id="snackbar"></div>

    <script src="../js/classes/Constantes.js"></script>
    <script src="./js/toaster.js"></script>
    <script src="../js/classes/Utils.js"></script>
    <script src="./js/constantes.js"></script>
    <script src="./js/spacecode-blocks.js"></script>
    <script src="./js/eventListeners.js"></script>
    <script src="./js/demo-basic.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
