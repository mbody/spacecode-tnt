<html>
  <head>
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        margin: 0;
        background: #1d1d1d;
        font-family: sans-serif;
        font-size: 14px;
        color: white;
        height: 100%;
      }

      input {
        padding: 12px;
        border-radius: 20px;
        border: none;
        background: #475569;
        color: #cbd5e1;
      }
      input::placeholder {
        color: #94a3b8;
      }

      canvas {
        /*background-image: url('/img/webb-dark.png');*/
        background-image: url('/img/bg.png');
        background-repeat: no-repeat;
        background-position: center center;
        background-size: cover;
        background-blend-mode: darken;
      }

      button {
        padding: 8px 20px;
        border-radius: 100px;
        border: none;
        background-image: linear-gradient(
          to right,
          rgb(6, 182, 212),
          rgb(59, 130, 246)
        );
        color: white;
        cursor: pointer;
      }

      #leaderboard {
        position: absolute;
        left: 10;
        top: 10;
        color: white;
        padding: 8px;
        user-select: none;
        background: rgba(0, 0, 0, 0.5);
      }
      #leaderboardTitle {
        margin-bottom: 8px;
        font-weight: bolder;
        font-size: 18px;
      }

      #nextPlayers {
        position: absolute;
        right: 10;
        top: 10;
        color: white;
        padding: 8px;
        user-select: none;
        background: rgba(0, 0, 0, 0.5);
      }
      #nextPlayersTitle {
        margin-bottom: 8px;
        font-weight: bolder;
        font-size: 18px;
      }

      #serverUrl {
        position: absolute;
        bottom: 10;
        padding: 5 10;
        color: #7b7b7b;
        text-align: center;
      }
      .hidden {
        display: none !important;
      }
      .alertbox {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
      }
      .center {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #gameover div {
        background-color: #f44336;
        padding: 30;
        font-size: 2em;
        border-radius: 10px;
        font-weight: bold;
        text-align: center;
      }
    </style>
  </head>
  <body style="display: flex; align-items: center; justify-content: center">
    <canvas id="gameboard"></canvas>
    <div id="leaderboard">
      <div id="leaderboardTitle">Leaderboard</div>
      <table>
        <tbody id="playerLabels"></tbody>
      </table>
    </div>
    <div id="nextPlayers">
      <div id="nextPlayersTitle">Prochains joueurs</div>
      <table>
        <tbody id="nextPlayersTable"></tbody>
      </table>
    </div>
    <div id="serverUrl">localhost</div>

    <!-- GAME OVER DIALOG -->

    <div id="gameover" class="alertbox" style="display: none">
      <div id="gameoverMessage">
        GAME OVER !<br />
        Winner is me !
      </div>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.2/gsap.min.js"
      integrity="sha512-kVlGhj2qFy+KBCFuvjBJTGUMxbdqJKs4yK2jh0e0VPhWUPiPC87bzm4THmaaIee3Oj7j6sDpTTgm2EPPiESqBg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script src="./js/classes/Constantes.js"></script>
    <script src="./js/classes/Utils.js"></script>
    <script src="./js/classes/GameObject.js"></script>
    <script src="./js/classes/Star.js"></script>
    <script src="./js/classes/Bonus.js"></script>
    <script src="./js/classes/Background.js"></script>
    <script src="./js/classes/Enemy.js"></script>
    <script src="./js/classes/Player.js"></script>
    <script src="./js/classes/Particle.js"></script>
    <script src="./js/classes/Projectile.js"></script>
    <script src="./js/frontend.js"></script>
    <script src="./js/eventListeners.js"></script>

    <div class="hidden">
      <img id="heart" src="./img/heart.svg" />
      <img id="riffle" src="./img/riffle.svg" />
      <img id="bomb" src="./img/bomb.svg" />
      <img id="shield" src="./img/shield.svg" />
      <img id="crystal" src="./img/crystal.svg" />
      <audio id="enemyDie" src="./sounds/enemyDie.mp3" />
      <audio id="playerDie" src="./sounds/playerDie.ogg" />
      <audio id="bonusCollected" src="./sounds/bonus.ogg" />
    </div>
  </body>
</html>
