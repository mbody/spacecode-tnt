<!DOCTYPE html>
<html lang="fr-FR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNAUTHORIZED</title>
</head>
<body>
    <script>
        const code = window.prompt("Entrez le code d'accès :", "").trim();
        document.cookie = `auth_token=${code}; path=/; expires=${new Date(Date.now() + 24 * 60 * 60 * 1000).toUTCString()}`;
        window.location.reload();
    </script>
</body>
</html>
